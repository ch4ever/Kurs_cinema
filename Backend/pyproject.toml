[project]
name = "kursach-backend"
version = "0.1.0"
description = "Django backend for Kursach"
requires-python = ">=3.13"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.29.0",
    "gunicorn>=23.0",
    "pillow>=10.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.uv]
package = false
